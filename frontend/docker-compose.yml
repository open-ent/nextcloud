version: "3"
services:
  node:
    image: node:26-alpine
    user: "node"
    container_name: node_app
    working_dir: /home/node/app
    environment:
      - TIPTAP_PRO_TOKEN
    tty: true
    stdin_open: true
    ports:
      - "4200:4200"
    network_mode: host
    volumes:
      - ./:/home/node/app
      - ~/.pnpm:/.pnpm
      - ~/.npm:/.npm
      - ~/.cache:/.cache
