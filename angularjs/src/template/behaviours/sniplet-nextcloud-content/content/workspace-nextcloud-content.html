<div id="nextcloud-content" class="sniplet nextcloud nextcloud-content">
    <div class="row">
        <!-- url connect -->
        <div ng-if="vm.nextcloudUrl && !vm.isNextcloudUrlHidden" class="cell">
            <i18n>nextcloud.url.connect</i18n> &#58; <a target="_blank" ng-href="[[vm.nextcloudUrl]]">[[vm.nextcloudUrl]]</a>
        </div>

        <!-- action : importer des fichiers dans NextCloud (bouton persistant, en plus de la
             dropzone), aligné à droite. Affiché seulement si droit d'écriture sur le dossier.
             On ouvre le sélecteur de fichiers NATIF (input caché) puis on délègue à
             onImportFiles() — le même traitement que le glisser-déposer. L'ancien
             toggleUploadFilesView(true) ouvrait le popup d'upload VIDE (sans sélecteur)
             d'où le « popup blanc ». Pattern angular.element(this).scope() déjà utilisé
             ailleurs dans le connecteur (debugInfo actif). -->
        <div class="cell right-magnet" ng-if="vm.canDropOnFolder()">
            <!-- Même style que le bouton « Importer » natif du workspace (classe
                 document-buttons-add + icône, cf view-src/workspace.html) : la CSS du
                 workspace est chargée sur la page, donc le rendu est identique. -->
            <button type="button" class="document-buttons-add" onclick="this.parentNode.querySelector('input[type=file]').click()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" fill-rule="evenodd" clip-path="url(#icon-download-nc)" clip-rule="evenodd"><path d="M7.293 16.293a1 1 0 0 1 1.414 0L12 19.586l3.293-3.293a1 1 0 0 1 1.414 1.414l-4 4a1 1 0 0 1-1.414 0l-4-4a1 1 0 0 1 0-1.414"></path><path d="M12 11a1 1 0 0 1 1 1v9a1 1 0 1 1-2 0v-9a1 1 0 0 1 1-1"></path><path d="M8.668 1.994A9 9 0 0 1 17.48 8H18a6.002 6.002 0 0 1 5.689 7.919 6 6 0 0 1-2.234 2.989 1 1 0 1 1-1.15-1.636A4 4 0 0 0 18 10H16.74a1 1 0 0 1-.969-.751A7 7 0 1 0 3.75 15.627a1 1 0 1 1-1.498 1.326A9 9 0 0 1 8.668 1.994"></path></g><defs><clipPath id="icon-download-nc"><path fill="#fff" d="M0 0h24v24H0z"></path></clipPath></defs></svg>
                <span><i18n>import</i18n></span>
            </button>
            <input type="file" multiple style="display:none;"
                   onchange="angular.element(this).scope().vm.upload.onImportFiles(this.files); angular.element(this).scope().$apply();" />
        </div>

        <!-- view mode -->
        <div class="cell right-magnet">
            <div class="choice-view">
                <i class="show-icons" ng-class="{ selected: vm.isViewMode('icons') }" ng-click="vm.changeViewMode('icons')"></i>
                <i class="show-list" ng-class="{ selected: vm.isViewMode('list') }" ng-click="vm.changeViewMode('list')"></i>
            </div>
        </div>
    </div>

    <!-- dropzone action file -->
    <dropzone-overlay
            ng-if="vm.isDropzoneEnabled()"
            on-import="vm.upload.onImportFiles($event)"
            can-drop="vm.canDropOnFolder()"
            on-cannot-drop="vm.onCannotDropFile()">
    </dropzone-overlay>

    <!-- view content -->
    <container template="documents-content"></container>

    <!-- empty state -->
    <div class="emptyscreen-nextcloud" ng-if="vm.isLoaded" ng-show="!vm.documents.length">
        <h2 class="emptyscreen-header">
            <i18n>empty.workspace.subfolder.title</i18n>
        </h2>

        <img class="emptyscreen-image__mini" src="/workspace/public/img/empty-workspace.svg" alt="">

        <p class="emptyscreen-footer">
            <i18n>empty.workspace</i18n>
        </p>
    </div>

    <!-- toolbar -->
    <div ng-include="'/nextcloud/public/template/behaviours/sniplet-nextcloud-content/toolbar/workspace-nextcloud-toolbar.html'"></div>

    <!-- upload file popup -->
    <div ng-include="'/nextcloud/public/template/behaviours/sniplet-nextcloud-content/content/workspace-nextcloud-upload-file.html'"></div>
</div>
