name: dev-check-repository

on: [push]

# Sans ce bloc, le GITHUB_TOKEN par défaut n'a pas accès en lecture aux paquets d'un
# AUTRE repo de l'org (entcore-v2/app-parent) -> 401 Unauthorized au resolve du parent POM
# (cf. build-and-publish.yml qui déclare packages: write pour la même raison, en plus large).
permissions:
  contents: read
  packages: read

jobs:
  build-node-test:
    runs-on: ubuntu-latest

    container:
      image: opendigitaleducation/node:18-alpine-pnpm
      options: --user root -v ${{ github.workspace }}:/home/node/:rw

    steps:
      - uses: actions/checkout@v1
      - name: Run pnpm install
        working-directory: ./frontend
        run: pnpm install
      - name: Check Quality Code
        working-directory: ./frontend
        run: pnpm run format:check && pnpm run lint
      - name: Run Build Vite
        working-directory: ./frontend
        run: pnpm build
      - name: Run tests
        working-directory: ./frontend
        run: pnpm test
      - name: Run npm install
        working-directory: ./angularjs
        run: yarn install
      - name: Run build node with Gulp
        working-directory: ./angularjs
        run: node_modules/gulp/bin/gulp.js build
      - name: Run test
        working-directory: ./angularjs
        run: yarn test

  build-maven-test:
    runs-on: ubuntu-latest

    container:
      image: maven:3.8.6-jdk-8
      options: --user root -v ${{ github.workspace }}:/home/maven/:rw

    steps:
      - uses: actions/checkout@v1
      # app-parent (fr.openent:app-parent) vit sur GitHub Packages (entcore-v2), pas sur
      # Maven Central -- sans ce profil, "mvn clean install" échoue en "Non-resolvable
      # parent POM" avant même de compiler quoi que ce soit. GITHUB_TOKEN (même avec
      # packages: read déclaré) ne peut PAS lire les paquets privés d'un AUTRE repo de
      # l'org -> 401 systématique ; il faut le PAT OPENENT_PACKAGES_TOKEN (cross-repo).
      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p /var/maven/.m2
          cat > /var/maven/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Run build maven
        working-directory: ./backend
        # ${env.GITHUB_TOKEN} dans settings.xml est résolu par Maven AU RUNTIME de mvn,
        # donc DANS ce step précis -- ne pas compter sur l'env du step précédent (qui n'a
        # servi qu'à écrire le fichier), sinon mot de passe vide -> 401.
        env:
          GITHUB_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: mvn -Duser.home=/var/maven clean install
      - name: Run maven test
        working-directory: ./backend
        env:
          GITHUB_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: mvn -Duser.home=/var/maven test